name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-x64 }
          - { runner: ubuntu-22.04, platform: linux-x64 }
          - { runner: ubuntu-22.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4

      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4.0"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: opam install . --deps-only --with-test

      - run: opam exec -- dune build --profile release @install

      - run: opam exec -- dune test --profile release

      - name: The binary reports the tag's version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          found="$(_build/default/bin/main.exe --version)"
          test "$found" = "$expected" || { echo "tag says $expected, dartea --version says $found"; exit 1; }

      - run: |
          mkdir -p out
          cp _build/default/bin/main.exe out/dartea-${{ matrix.platform }}
          strip out/dartea-${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: dartea-${{ matrix.platform }}
          path: out/dartea-${{ matrix.platform }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true

      - run: node npm/stage.mjs "${GITHUB_REF_NAME#v}" binaries staged

      - name: Publish the platform packages, then dartea
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            (cd "staged/$platform" && npm publish --access public --provenance)
          done
          (cd staged/dartea && npm publish --access public --provenance)

      - name: GitHub release with the binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for binary in binaries/dartea-*; do
            tar -czf "$binary.tar.gz" -C binaries "$(basename "$binary")" -C .. LICENSE NOTICE
          done
          gh release create "$GITHUB_REF_NAME" --generate-notes binaries/*.tar.gz
